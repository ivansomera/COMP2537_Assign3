<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assign 3</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- import jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  </head>

  <body>
    <div class="px-6 flex flex-col items-center min-h-screen">
      <header class="flex justify-center gap-24 py-6">
        <div
          id="btn-container"
          class="flex flex-wrap items-center justify-center gap-4"
        >
          <button
            id="easyDifficulty"
            class="btn px-7 py-3 font-semibold tracking-wider text-sm border-2 rounded-lg border-green-500 text-green-500 hover:bg-green-500 hover:text-white active:scale-95 transition-all duration-200 ease-in-out cursor-pointer"
          >
            Easy
          </button>

          <button
            id="medDifficulty"
            class="btn px-7 py-3 font-semibold tracking-wider text-sm border-2 rounded-lg border-blue-500 text-blue-500 hover:bg-blue-500 hover:text-white active:scale-95 transition-all duration-200 ease-in-out cursor-pointer"
          >
            Medium
          </button>

          <button
            id="hardDifficulty"
            class="btn px-7 py-3 font-semibold tracking-wider text-sm border-2 rounded-lg border-red-500 text-red-500 hover:bg-red-500 hover:text-white active:scale-95 transition-all duration-200 ease-in-out cursor-pointer"
          >
            Hard
          </button>
        </div>
        <!-- Stats -->
        <div
          id="game-stats"
          class="hidden items-center flex flex-col justify-center gap-6"
        >
          <div id="timer" class="text-2xl font-bold"></div>
          <div class="timerTotal" class="text-xl"></div>
          <div class="flex gap-6 text-sm">
            <div>
              <h3>Clicks: <span id="clicks">0</span></h3>
              <h3>Pairs left: <span id="pairs-left">0</span></h3>
            </div>
            <div>
              <h3>Pairs Matched: <span id="pairs-matched">0</span></h3>
              <h3>Total Pairs: <span id="total-pairs">0</span></h3>
            </div>
          </div>
          <div class="flex gap-6">
            <button
              id="resetBtn"
              class="bg-blue-500 text-white font-bold py-2 px-4 rounded"
            >
              Reset
            </button>
            <button
              id="changeBtn"
              class="bg-orange-500 text-white font-bold py-2 px-4 rounded"
            >
              Change Difficulty
            </button>
          </div>
        </div>
      </header>
      <!-- Start Button -->
      <button
        id="startBtn"
        class="hidden bg-red-500 text-white font-bold px-6 py-4 rounded mb-4"
      >
        Start
      </button>

      <!-- Grid -->
      <div
        id="game_grid"
        class="grid min-h-[400px] w-[600px] gap-2 relative mt-6 border-2 border-red-500"
      ></div>
      <!-- Win/Lose message -->
      <div
        id="message"
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-red-500 z-999 p-6 text-white rounded-xl hidden"
      ></div>
      <!-- Power up -->
      <div class="mt-4 flex justify-center">
        <button
          id="powerUpBtn"
          class="bg-yellow-400 text-black font-bold py-2 px-6 rounded-lg hidden"
        >
          Power Up
        </button>
      </div>
    </div>

    <!-- Light/Dark Mode -->
    <div class="fixed top-4 right-4 z-50 flex gap-2">
      <button
        id="lightMode"
        class="bg-white text-black border border-gray-300 font-semibold py-1 px-3 rounded-lg text-sm"
      >
        Light
      </button>
      <button
        id="darkMode"
        class="bg-gray-900 text-white font-semibold py-1 px-3 rounded-lg text-sm"
      >
        Dark
      </button>
    </div>
    <script src="index.js"></script>
  </body>
</html>
